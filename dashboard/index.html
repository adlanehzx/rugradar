<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RugRadar</title>
<style>body{font:16px system-ui;background:#101820;color:#eef4f7;max-width:1150px;margin:40px auto;padding:20px}h1{color:#66e3b4}input,select,button,a{padding:10px;background:#233443;color:#fff;border:1px solid #506879;border-radius:6px}table{width:100%;border-collapse:collapse;margin-top:25px}td,th{text-align:left;padding:12px;border-bottom:1px solid #344958}tr:hover{background:#20303b;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}dialog{background:#182735;color:white;width:85%;max-width:850px;border:1px solid #66e3b4}svg{width:100%;height:150px}small{color:#b4c7d3}</style>
<h1>RugRadar</h1><p>Surveillance PancakeSwap V2 · BSC</p><p id="status">Chargement…</p>
<input id="search" aria-label="Rechercher" placeholder="Nom, symbole ou adresse"><select id="risk" aria-label="Niveau de risque"><option value="">Tous les niveaux</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option><option>Indeterminate</option></select><label><input id="watched" type="checkbox"> Suivis uniquement</label> <a href="/export.csv">Exporter CSV</a>
<p id="error" role="alert"></p><table><thead><tr><th>Token</th><th>Indice heuristique</th><th>Risque</th><th>Liquidité BNB</th><th>Dernière analyse UTC</th></tr></thead><tbody id="rows"></tbody></table>
<dialog id="detail"><button id="close">Fermer</button><h2 id="title"></h2><p>Évolution du score, de l’analyse la plus ancienne à la plus récente (0–100)</p><svg id="chart" viewBox="0 0 600 150" role="img" aria-label="Historique du score"></svg><pre id="report"></pre></dialog>
<script>
let reports=[],watches=[];const $=id=>document.getElementById(id);
async function get(url){const r=await fetch(url);if(!r.ok)throw Error('Données indisponibles');return r.json()}
function draw(){const q=$('search').value.toLowerCase();$('rows').replaceChildren();for(const r of reports){const f=r.facts,a=r.assessment;if(![f.name,f.symbol,f.token].join(' ').toLowerCase().includes(q)||($('risk').value&&a.level!==$('risk').value)||($('watched').checked&&!watches.includes(f.token)))continue;const row=document.createElement('tr');for(const value of [f.symbol+' · '+f.name,a.scoring_version===2?a.score+' (heuristique)':'Ancien rapport',a.scoring_version===2?a.level:'Indeterminate (ancien rapport)',Number(f.liquidity_bnb).toFixed(3),r.analysed_at]){const td=document.createElement('td');td.textContent=value;row.append(td)}row.tabIndex=0;row.onclick=()=>openReport(r);row.onkeydown=e=>{if(e.key==='Enter')openReport(r)};$('rows').append(row)}}
async function openReport(r){$('title').textContent=r.facts.name;$('report').textContent=JSON.stringify(r,null,2);$('chart').replaceChildren();$('detail').showModal();try{const h=(await get('/api/history?token='+encodeURIComponent(r.facts.token))).reverse();const svg=document.createElementNS('http://www.w3.org/2000/svg','polyline');svg.setAttribute('points',h.map((x,i)=>`${10+i*580/Math.max(1,h.length-1)},${140-x.report.assessment.score*1.3}`).join(' '));svg.setAttribute('stroke','#66e3b4');svg.setAttribute('fill','none');svg.setAttribute('stroke-width','3');$('chart').append(svg)}catch(e){$('report').textContent+='\nHistorique indisponible'}}
async function refresh(){try{const [r,s]=await Promise.all([get('/api/tokens'),get('/api/status')]);reports=r;watches=s.watchlist;$('status').textContent=`${r.length} tokens affichés · Bloc ${s.last_block??'?'} · Retard ${s.lag_blocks??'?'} blocs · ${s.pending_alerts} alertes en attente · Dernière analyse UTC : ${s.latest_analysis??'aucune'}`;$('error').textContent=s.scanner_stale?'⚠ Scanner sans signal récent : données potentiellement périmées.':'';draw()}catch(e){$('error').textContent='Connexion impossible. Vérifie que le scanner et la base sont disponibles.'}}
$('search').oninput=draw;$('risk').onchange=draw;$('watched').onchange=draw;$('close').onclick=()=>$('detail').close();refresh();setInterval(refresh,15000);
</script></html>
