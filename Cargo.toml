[package]
name = "rugradar"
version = "0.1.0"
edition = "2024"
description = "Real-time risk scanner for new PancakeSwap V2 tokens on BNB Smart Chain"
license = "MIT"
rust-version = "1.94.1"

[dependencies]
alloy = { version = "2.6.1", features = ["full", "provider-ws", "rpc-types"] }
anyhow = "1.0.104"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
